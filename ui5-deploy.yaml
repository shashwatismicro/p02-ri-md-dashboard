# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.oswal.managementcockpit.managementcockpit
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DEV_SAML_ASSERTION
          url: https://my430588.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZMGMTCOCKPIT
          description: Management Cockpit
          package: ZMANAGEMENT_COCKPIT
          transport: BZ8K901693
        exclude:
          - /test/
          - /localService/
